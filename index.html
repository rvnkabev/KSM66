<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Jarvisng Decision Model</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 24px;
    color: #222;
  }

  .container {
    max-width: 1000px;
    margin: auto;
  }

  h1 {
    margin-bottom: 8px;
  }

  .fact-box {
    background: #111;
    color: white;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 20px;
  }

  .step {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
  }

  .step h2 {
    margin-top: 0;
    font-size: 20px;
  }

  label {
    font-weight: 600;
    display: block;
    margin-top: 12px;
  }

  textarea, input, select {
    width: 100%;
    box-sizing: border-box;
    margin-top: 6px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
  }

  textarea {
    min-height: 90px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .danger {
    background: #fff0f0;
    border-left: 5px solid #d93025;
  }

  .safe {
    background: #eefaf1;
    border-left: 5px solid #188038;
  }

  .action {
    background: #eef4ff;
    border-left: 5px solid #1a73e8;
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    border: none;
    border-radius: 12px;
    background: #111;
    color: white;
    cursor: pointer;
    margin-top: 20px;
  }

  #output {
    white-space: pre-wrap;
    background: #fff;
    padding: 18px;
    border-radius: 14px;
    margin-top: 20px;
    border: 1px solid #ddd;
  }
</style>
</head>

<body>
<div class="container">

  <h1>Jarvisng Decision Model</h1>
  <p>目標：在 Unknown + Human Bias 存在下，做出 No Ruin 的行動。</p>

  <div class="fact-box">
    <strong>Base Fact</strong><br>
    1. Unknown exist<br>
    2. Human bias exist
  </div>

  <div class="step">
    <h2>3. Core Drive</h2>
    <label>我真正想要什麼？</label>
    <textarea id="coreDrive" placeholder="例如：想增加生產力 / 賺錢 / 保護身體 / 減少焦慮"></textarea>
  </div>

  <div class="step">
    <h2>4. Observation</h2>
    <div class="grid">
      <div>
        <label>Fact</label>
        <textarea id="fact" placeholder="已知事實"></textarea>
      </div>
      <div>
        <label>Unknown</label>
        <textarea id="unknown" placeholder="未知、不確定、不可確認的部分"></textarea>
      </div>
    </div>
  </div>

  <div class="step">
    <h2>5. Analysis</h2>
    <label>背後運作原理</label>
    <textarea id="principle"></textarea>

    <label>Jarvisng 理解程度？</label>
    <select id="understanding">
      <option>低：主要靠感覺</option>
      <option>中：有部分模型，但未驗證</option>
      <option>高：有數據 / 經驗 / 可重複檢測</option>
    </select>

    <label>可以如何檢測？交給誰檢查？</label>
    <textarea id="checkMethod"></textarea>
  </div>

  <div class="step">
    <h2>6. Prediction</h2>
    <label>可能結果分布</label>
    <textarea id="prediction" placeholder="最好 / 中性 / 最差情況"></textarea>

    <label>我有多大把握？</label>
    <input id="confidence" type="number" min="0" max="100" placeholder="0-100%">
  </div>

  <div class="step">
    <h2>7. EV</h2>
    <label>正面回報</label>
    <textarea id="upside"></textarea>

    <label>負面風險</label>
    <textarea id="downside" placeholder="例如：肩傷、盂唇受傷、6個月至3年、重複甩骹風險"></textarea>
  </div>

  <div class="step">
    <h2>Control / Uncontrollable</h2>
    <div class="grid">
      <div>
        <label>Control</label>
        <textarea id="control" placeholder="我能控制的事：注碼、時間、檢查、停損、休息"></textarea>
      </div>
      <div>
        <label>Uncontrollable</label>
        <textarea id="uncontrol" placeholder="市場情緒、身體復原速度、其他人反應、宏觀周期"></textarea>
      </div>
    </div>
  </div>

  <div class="step danger">
    <h2>8. Safety Point / No Ruin</h2>
    <label>最差情況我是否能承受？</label>
    <select id="bearable">
      <option>能承受</option>
      <option>不能承受</option>
      <option>不確定</option>
    </select>

    <label>會不會影響 No Ruin？</label>
    <select id="noRuin">
      <option>不會</option>
      <option>會</option>
      <option>不確定</option>
    </select>
  </div>

  <div class="step safe">
    <h2>9. Small Bet / 分散出海 / 有限責任 / 永久資產</h2>

    <label>Small Bet 設計</label>
    <textarea id="smallBet" placeholder="最大損失是多少？"></textarea>

    <label>分散出海</label>
    <textarea id="diversify" placeholder="是否分散時間、資金、風險來源？"></textarea>

    <label>有限責任</label>
    <textarea id="limitedLiability" placeholder="最壞情況是否被限制？"></textarea>

    <label>永久資產</label>
    <textarea id="permanentAsset" placeholder="這次行動會否累積知識、身體能力、現金流、系統？"></textarea>
  </div>

  <div class="step action">
    <h2>11. Action</h2>
    <label>下一步行動</label>
    <textarea id="action"></textarea>
  </div>

  <div class="step">
    <h2>12. Review</h2>
    <label>之後如何回顧？</label>
    <textarea id="review" placeholder="何時 review？看什麼指標？是否修正模型？"></textarea>
  </div>

  <button onclick="generateSummary()">生成決策摘要</button>

  <div id="output"></div>

</div>

<script>
function generateSummary() {
  const bearable = document.getElementById("bearable").value;
  const noRuin = document.getElementById("noRuin").value;

  let warning = "";

  if (bearable !== "能承受" || noRuin !== "不會") {
    warning = "⚠️ 結論：暫停 / 降低注碼 / 重新設計 Safety Point。\n";
  } else {
    warning = "✅ 結論：可考慮執行 Small Bet，但仍需 Review。\n";
  }

  const summary = `
${warning}

【Core Drive】
${coreDrive.value}

【Fact】
${fact.value}

【Unknown】
${unknown.value}

【Analysis】
背後原理：
${principle.value}

理解程度：
${understanding.value}

檢測方法：
${checkMethod.value}

【Prediction】
${prediction.value}

把握度：
${confidence.value || "未填"}%

【EV】
正面回報：
${upside.value}

負面風險：
${downside.value}

【Control】
${control.value}

【Uncontrollable】
${uncontrol.value}

【Safety Point】
最差情況是否承受：${bearable}
是否影響 No Ruin：${noRuin}

【Small Bet】
${smallBet.value}

【分散出海】
${diversify.value}

【有限責任】
${limitedLiability.value}

【永久資產】
${permanentAsset.value}

【Action】
${action.value}

【Review】
${review.value}
`;

  document.getElementById("output").innerText = summary;
}
</script>

</body>
</html>
